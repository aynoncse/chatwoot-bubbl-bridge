name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Azure runs the uploaded node_modules as-is - nothing installs dependencies on the server
      # side - so the package has to carry them, and only the ones index.js actually needs.
      - name: Reinstall production dependencies only
        run: npm ci --omit=dev

      # data/ is deliberately excluded: the live mapping files belong to the running instance
      # (DATA_DIR=/home/data on App Service) and must never be overwritten by a deploy.
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x '.git/*' '.github/*' 'test/*' 'data/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact
        run: unzip release.zip -d release

      # This repo is public, so the target Web App is named by a repo variable rather than
      # written into the workflow - set AZURE_WEBAPP_NAME under Settings -> Secrets and
      # variables -> Actions -> Variables. A fork, or a clone with the variable unset, simply
      # skips the deploy instead of aiming at someone else's App Service.
      - name: Deploy to Azure Web App
        if: vars.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: release
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
